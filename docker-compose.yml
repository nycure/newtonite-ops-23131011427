version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite_postgres
    restart: always
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: password
      POSTGRES_DB: newtonite_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newtonite_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://newtonite:password@postgres:5432/newtonite_ops
      - SECRET_KEY=super-secret-newtonite-challenge-key-2026-production-ready
      - ENVIRONMENT=production
      - DEBUG=False
      - OUTBOX_POLL_INTERVAL_SECONDS=2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newtonite_frontend
    restart: always
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
